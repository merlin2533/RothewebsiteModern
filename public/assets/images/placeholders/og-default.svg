<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="Maschinentransport seit 1978.">
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B2545"/>
    <stop offset="1" stop-color="#050F22"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.7" cy="0.25" r="0.7">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C2410C"/>
    <stop offset="1" stop-color="#E5734A"/>
  </linearGradient>
</defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- ground line -->
  <rect x="0" y="" width="1200" height="3" fill="#000" fill-opacity="0.25"
        transform="translate(0 ".((int)(630 * 0.78)).")"/>

  <!-- vehicle / scene -->
  <g fill="#1B2D4D" fill-opacity="1">
  <!-- hood -->
  <path d="M -40,491 L -40,361 Q -40,361 -40,361
           L 90,361
           Q 90,291 90,291
           L 70,291
           Q 70,291 70,291
           L 70,491 Z"/>
  <!-- windscreen highlight -->
  <path d="M 90 361 L 70 291 L 70 361 Z" fill="#ffffff" fill-opacity="0.08"/>
</g><path d='
        M 200,361
        L 300,361
        L 340,396
        L 340,431
        L 1040,431
        L 1040,381
        L 1120,381
        L 1120,461
        L 200,461
        Z' fill='#1B2D4D'/><path d='M 340,431 L 1040,431'
            stroke='#C2410C' stroke-width='3' fill='none'/><circle cx="0" cy="449" r="42" fill="#0a0a12"/><circle cx="0" cy="449" r="16" fill="#3a4a64"/><circle cx="80" cy="449" r="42" fill="#0a0a12"/><circle cx="80" cy="449" r="16" fill="#3a4a64"/><circle cx="910" cy="449" r="42" fill="#0a0a12"/><circle cx="910" cy="449" r="16" fill="#3a4a64"/><circle cx="980" cy="449" r="42" fill="#0a0a12"/><circle cx="980" cy="449" r="16" fill="#3a4a64"/><circle cx="1040" cy="449" r="42" fill="#0a0a12"/><circle cx="1040" cy="449" r="16" fill="#3a4a64"/><circle cx="1110" cy="449" r="42" fill="#0a0a12"/><circle cx="1110" cy="449" r="16" fill="#3a4a64"/>

  <!-- copper accent strip bottom -->
  <rect x="0" y="" width="1200" height="6" fill="url(#copperGrad)"
        transform="translate(0 ".(630 - 6).")"/>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="80" y="138" width="36" height="3" fill="#C2410C"/>
  <text x="80" y="138" dy="28" font-size="14" font-weight="600"
        letter-spacing="3.5" fill="#C2410C" text-transform="uppercase">ROTHE-TRANSPORTE</text>
  <text x="80" y="138" dy="92" font-size="64" font-weight="700"
        letter-spacing="-2" fill="#FFFFFF">Maschinentransport seit 1978.</text>
  <text x="80" y="138" dy="130" font-size="20" font-weight="400"
        fill="#FFFFFF" fill-opacity="0.7">Walddorfhäslach · DE · AT · CH · FR · NL · BE</text>
</g>
</svg>