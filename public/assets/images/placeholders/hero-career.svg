<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="Stamm-Mannschaft.">
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B2545"/>
    <stop offset="1" stop-color="#050F22"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.7" cy="0.25" r="0.7">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C2410C"/>
    <stop offset="1" stop-color="#E5734A"/>
  </linearGradient>
</defs>
  <rect width="1920" height="720" fill="url(#bg)"/>
  <rect width="1920" height="720" fill="url(#grid)"/>
  <rect width="1920" height="720" fill="url(#halo)"/>

  <!-- ground line -->
  <rect x="0" y="" width="1920" height="3" fill="#000" fill-opacity="0.25"
        transform="translate(0 ".((int)(720 * 0.78)).")"/>

  <!-- vehicle / scene -->
  <path d='M 0 561 L 1920 531 L 1920 591 L 0 591 Z'
                            fill='#13223D'/><line x1='0' y1='561' x2='1920' y2='531'
                          stroke='#C2410C' stroke-width='4' stroke-dasharray='30 20'/><g fill="#1B2D4D" fill-opacity="1">
  <!-- hood -->
  <path d="M 456,561 L 456,431 Q 456,431 456,431
           L 586,431
           Q 586,361 586,361
           L 566,361
           Q 566,361 566,361
           L 566,561 Z"/>
  <!-- windscreen highlight -->
  <path d="M 586 431 L 566 361 L 566 431 Z" fill="#ffffff" fill-opacity="0.08"/>
</g><rect x='676' y='341' width='620' height='190' fill='#1B2D4D'/><rect x='676' y='341' width='620' height='5' fill='#C2410C'/><rect x='706' y='271' width='80' height='70' fill='#1B2D4D'/><rect x='736' y='151' width='30' height='130' fill='#1B2D4D'/><path d='M 751,151 L 1116,181 L 1116,201 L 751,181 Z'
            fill='#C2410C'/><line x1='1116' y1='181' x2='1116' y2='281' stroke='#1B2D4D' stroke-width='3'/><circle cx='1116' cy='291' r='10' fill='#C2410C'/><circle cx="496" cy="519" r="42" fill="#0a0a12"/><circle cx="496" cy="519" r="16" fill="#3a4a64"/><circle cx="576" cy="519" r="42" fill="#0a0a12"/><circle cx="576" cy="519" r="16" fill="#3a4a64"/><circle cx="1156" cy="519" r="42" fill="#0a0a12"/><circle cx="1156" cy="519" r="16" fill="#3a4a64"/><circle cx="1236" cy="519" r="42" fill="#0a0a12"/><circle cx="1236" cy="519" r="16" fill="#3a4a64"/>

  <!-- copper accent strip bottom -->
  <rect x="0" y="" width="1920" height="6" fill="url(#copperGrad)"
        transform="translate(0 ".(720 - 6).")"/>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="80" y="158" width="36" height="3" fill="#C2410C"/>
  <text x="80" y="158" dy="28" font-size="14" font-weight="600"
        letter-spacing="3.5" fill="#C2410C" text-transform="uppercase">KARRIERE</text>
  <text x="80" y="158" dy="92" font-size="64" font-weight="700"
        letter-spacing="-2" fill="#FFFFFF">Stamm-Mannschaft.</text>
  <text x="80" y="158" dy="130" font-size="20" font-weight="400"
        fill="#FFFFFF" fill-opacity="0.7">Berufskraftfahrer (CE) für unsere Touren in sechs Länder.</text>
</g>
</svg>