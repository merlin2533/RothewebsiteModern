<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Porträtfoto Inhaber">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5DB3"/>
      <stop offset="1" stop-color="#0D2547"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#2E7DD1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0D2547" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="400" cy="310" r="160"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bg)"/>
  <rect width="800" height="900" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
  </g>

  <!-- Avatar circle background -->
  <circle cx="400" cy="310" r="172" fill="#2E7DD1" fill-opacity="0.2"/>
  <circle cx="400" cy="310" r="160" fill="#1A4D8A"/>

  <!-- Person silhouette (head + shoulders) -->
  <!-- Head -->
  <circle cx="400" cy="268" r="68" fill="#2E7DD1" fill-opacity="0.8"/>
  <!-- Shoulders / body -->
  <ellipse cx="400" cy="430" rx="110" ry="75" fill="#2E7DD1" fill-opacity="0.8"/>

  <!-- Accent bar at bottom -->
  <rect x="0" y="870" width="800" height="6" fill="#1B5DB3" opacity="0.8"/>

  <!-- "Kein Foto" label -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="400" y="660" text-anchor="middle" font-size="14" font-weight="600"
          letter-spacing="3" fill="#ffffff" fill-opacity="0.45">FOTO FOLGT</text>
  </g>
</svg>
