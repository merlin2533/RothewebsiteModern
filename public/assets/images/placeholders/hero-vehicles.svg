<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="Vier Fahrzeuge.">
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050F22"/>
    <stop offset="1" stop-color="#0B2545"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.7" cy="0.25" r="0.7">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C2410C"/>
    <stop offset="1" stop-color="#E5734A"/>
  </linearGradient>
</defs>
  <rect width="1920" height="720" fill="url(#bg)"/>
  <rect width="1920" height="720" fill="url(#grid)"/>
  <rect width="1920" height="720" fill="url(#halo)"/>

  <!-- ground line -->
  <rect x="0" y="" width="1920" height="3" fill="#000" fill-opacity="0.25"
        transform="translate(0 ".((int)(720 * 0.78)).")"/>

